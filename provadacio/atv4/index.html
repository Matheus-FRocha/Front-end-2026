<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Jogador da Copa do Mundo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style> 
        body, html {
            height: 100%;
            margin: 0;
            overflow-x: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #101820;
        }

        .bg-copa {
            background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('img/FIFA-World-Cup-26.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }


        .content-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 22rem;
        }

        .card {
            backdrop-filter: blur(15px);
            background-color: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            overflow: hidden;
            width: 100%;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card-img-top {
            height: 350px;
            object-fit: cover; 
            object-position: top center;
            border-bottom: 5px solid #00df59;
        }

        .card-body {
            padding: 25px;
        }

        .btn-revelar {
            background-color: #00df59 !important;
            border: none !important;
            color: #101820 !important;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 50px;
            padding: 12px 60px !important;
            box-shadow: 0 0 20px rgba(0, 223, 89, 0.4);
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-revelar:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(0, 223, 89, 0.7);
        }
    </style>
</head>
<body>

    <div class="bg-copa">
        <div class="content-wrapper">       
            
            <div class="card">
                <img src="img_.svg" class="card-img-top" alt="Jogador" id="jogadorImg">
            
                <div class="card-body text-center">
                    <h5 id="Nome" class="card-title placeholder-glow mb-3">
                        <span class="placeholder col-8"></span>
                        <span id="Rank" class="badge text-bg-secondary">-</span>
                    </h5>
                    
                    <p class="card-text placeholder-glow">
                        <span id="Data_Nas" class="placeholder col-9"></span><br>
                        <span id="Alutra" class="placeholder col-6"></span><br>
                        <span id="Posição " class="placeholder col-10"></span>
                    </p>
                </div>
            </div>

            <a href="#" onclick="revelar(event)" class="btn-revelar mt-4">
                Revelar Jogador
            </a>
            
        </div>
    </div>

    <script>
        function revelar(event) {
            event.preventDefault();

            const imagem = document.getElementById('jogadorImg');
            imagem.src = '_vinicius_junior.png'; 

            const spanNome = document.querySelector('#Nome span.placeholder');
            const spanRank = document.getElementById('Rank');
            const spanDataNas = document.getElementById('Data_Nas');
            const spanAltura = document.getElementById('Alutra'); 
            const spanPosicao = document.getElementById('Posição ');

            spanNome.innerText = "Vinícius José Paixão de Oliveira Júnior";
            spanRank.innerText = "9,5";
            spanDataNas.innerText = "📅 12/07/2000 (25 anos)";
            spanAltura.innerText = "📏 1,76 m";
            spanPosicao.innerText = "🏃 Ponta-esquerda / Atacante";

            const spans = [spanNome, spanDataNas, spanAltura, spanPosicao];
            spans.forEach(el => {
                if(el) {
                    el.classList.remove('placeholder', 'col-8', 'col-9', 'col-6', 'col-10');
                    el.classList.add('card-text');
                }
            });

            document.getElementById('Nome').classList.remove('placeholder-glow');
            spanDataNas.parentElement.classList.remove('placeholder-glow');

            spanRank.classList.remove('text-bg-secondary');
            spanRank.classList.add('text-bg-success');
        }
    </script>

</body>
</html>
